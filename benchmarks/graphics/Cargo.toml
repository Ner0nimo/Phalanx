[package]
name = "phalanx-graphics-spike"
version = "0.1.0"
edition = "2021"
publish = false
description = "Issue #10 spike: wgpu vs ash renderer API comparison (ADR-0004 input). Detached from the production workspace."

[workspace]

[features]
default = []
wgpu = ["dep:wgpu", "dep:pollster"]
ash = ["dep:ash"]

[dependencies]
wgpu = { version = "30", optional = true }
pollster = { version = "1", optional = true }
ash = { version = "0.38", optional = true }

[[bin]]
name = "wgpu-spike"
path = "src/wgpu_spike.rs"
required-features = ["wgpu"]

[[bin]]
name = "ash-spike"
path = "src/ash_spike.rs"
required-features = ["ash"]

[profile.release]
opt-level = 3
debug = false
