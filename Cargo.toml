[workspace]
members = ["crates/phalanx_core", "crates/phalanx_runtime"]
# The spike benchmarks are detached workspaces of their own (see ADR-0003 and
# ADR-0004); CI gates intentionally do not build them (dedicated jobs do).
exclude = ["benchmarks/ecs", "benchmarks/graphics"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
